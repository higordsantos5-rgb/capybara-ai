[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "capybara-ai"
version = "0.1.0"
description = "Capability-first Python microframework for configurable AI agents, provider routing, multimodal context, and explicit MCP tooling."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Capybara AI maintainers" }
]
keywords = ["ai", "agents", "providers", "routing", "mcp", "multimodal"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
  "License :: OSI Approved :: MIT License",
]
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
mcp = ["mcp>=1.0.0"]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["capybara_ai"]
